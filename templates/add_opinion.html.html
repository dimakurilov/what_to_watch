<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить мнение</title>
</head>
<body>
    <h1>Добавить мнение о фильме</h1>
    <a href="/">На главную</a>
    <hr>
    <form method="POST">
        {{ form.csrf_token }}
        <p>
            {{ form.title.label }}<br>
            {{ form.title(size=50) }}
        </p>
        <p>
            {{ form.text.label }}<br>
            {{ form.text(rows=5, cols=50) }}
        </p>
        <p>
            {{ form.source.label }}<br>
            {{ form.source(size=50) }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
</body>
</html>
