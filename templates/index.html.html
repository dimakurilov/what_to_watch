<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мнения о фильмах</title>
</head>
<body>
    <h1>Что посмотреть?</h1>
    <a href="/add">Добавить мнение</a>
    <hr>
    {% for opinion in opinions %}
        <div style="border: 1px solid #ccc; margin-bottom: 10px; padding: 10px;">
            <h3>{{ opinion.title }}</h3>
            <p>{{ opinion.text }}</p>
            {% if opinion.source %}
                <a href="{{ opinion.source }}" target="_blank">Источник</a>
            {% endif %}
        </div>
    {% else %}
        <p>Пока нет ни одного мнения. Добавьте первое!</p>
    {% endfor %}
</body>
</html>
